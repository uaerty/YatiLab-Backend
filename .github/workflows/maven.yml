name: CI Pipeline (Spring Boot + H2)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Build & run tests with H2 profile
      - name: Build with Maven (H2 test profile)
        run: mvn -B clean verify -Dspring.profiles.active=test

      # Package the app
      - name: Package Spring Boot app
        run: mvn -B package -DskipTests

      # Upload artifact (optional)
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: yatilab-jar
          path: target/*.jar
